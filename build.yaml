include:
  - board: nice_nano//zmk
    shield: sofle_left
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
  - board: nice_nano//zmk
    shield: sofle_right
  # Erases the settings/NVS partition (persisted RGB state, BLE bonds,
  # etc). Flash this to a half, wait for it to boot once, then reflash
  # normal firmware to that half. Same image for both halves.
  - board: nice_nano//zmk
    shield: settings_reset
  # Experimental: zmk-nice-oled custom status screen (see NOTES.md).
  # Separate build targets alongside the plain sofle_left/sofle_right
  # above, so the known-working firmware is still available as a fallback
  # if this crashes on hardware like the earlier hand-rolled attempts did.
  - board: nice_nano//zmk
    shield: sofle_left nice_oled
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
  - board: nice_nano//zmk
    shield: sofle_right nice_oled
