# NOTE: board is nice_nano_v2, not nice_nano//zmk as on master.
# ZMK v0.3.0 predates HWMv2 - boards there still live at
# app/boards/arm/nice_nano/ with the old flat naming. The `//zmk`
# variant suffix only exists on post-Zephyr-4.1 ZMK.
#
# The sofle shield at v0.3.0 ships boards/nice_nano_v2.overlay, which
# carries the same RGB underglow wiring (spi3, led_strip, chosen
# zmk,underglow) that main's nice_nano_nrf52840_zmk.overlay does - so
# underglow still works here without hand-rolling an overlay back in.
include:
  - board: nice_nano_v2
    shield: sofle_left nice_oled
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
  - board: nice_nano_v2
    shield: sofle_right nice_oled
  # Erases the settings/NVS partition (persisted RGB state, BLE bonds,
  # etc). Flash this to a half, wait for it to boot once, then reflash
  # normal firmware to that half. Same image for both halves.
  - board: nice_nano_v2
    shield: settings_reset

# The two zmk-usb-logging diagnostic variants from master are omitted
# here on purpose. They existed to capture the crash from our own
# config/src/status_screen.c, which this branch doesn't build at all -
# nice!oled supplies the custom status screen instead.
