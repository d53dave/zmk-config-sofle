manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: d53dave
      url-base: https://github.com/d53dave
  projects:
    # PINNED, deliberately. zmk-nice-oled is written against LVGL 8 and is
    # tested only against ZMK v0.3.0. ZMK's Zephyr 4.1 update (upstream
    # 2025-12-09) brought LVGL 9.3, which deletes the entire canvas
    # immediate-mode draw API that module is built on - ~61 call sites of
    # lv_canvas_draw_text/img/rect/line, plus the lv_img_* -> lv_image_*
    # rename and new stride/magic fields on image descriptors. It does not
    # compile against `main` and no fork has ported it: as of 2026-08-10
    # every actively-pushed fork changes only artwork (logos, sprites,
    # animation options), none touch the LVGL API.
    #
    # So this branch trades current ZMK for working nice!oled widgets.
    # Do not bump this to `main` without doing that port first.
    #
    # CONFIRMED WORKING on hardware 2026-08-10: widgets render correctly
    # on both SSD1306 halves, and nice!oled plus ZMK Studio fit in RAM
    # together on the left half (they compiled together, which wasn't
    # proof - this is).
    - name: zmk
      remote: zmkfirmware
      revision: v0.3.0
      import: app/west.yml
    # Our fork, not upstream. Carries two patches, both about making the
    # WPM graph and the fixed modifier indicators coexist:
    #
    #   2b107df  wpm.c gated the WPM graph behind
    #            `!MODIFIERS_INDICATORS_FIXED`, while screen.c draws the
    #            modifiers behind `MODIFIERS_INDICATORS_FIXED` - making
    #            the two mutually exclusive at compile time with no
    #            config path to having both. Drops that one term from
    #            the guard.
    #   af7f430  ...which then reveals *why* upstream made them
    #            exclusive: both draw around Y=95..129 and overlap. The
    #            graph's position was hardcoded while every other widget
    #            has a *_CUSTOM_X/Y pair, so this adds
    #            NICE_OLED_WIDGET_WPM_GRAPH_CUSTOM_X/Y, defaulting to
    #            the old hardcoded values. Set in sofle.conf.
    #
    # Upstream is dead (last push 2026-01-26), so there is little to
    # rebase onto. Both patches are small and mechanical.
    - name: zmk-nice-oled
      remote: d53dave
      revision: main
  self:
    path: config
