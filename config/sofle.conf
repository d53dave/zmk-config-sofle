# Uncomment the following line to enable the Sofle OLED Display
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_WIDGET_WPM_STATUS=y

# Experiment: icon glyphs (LV_SYMBOL_* - battery/output/layer icons)
# render as noise/inverted while plain text is fine. Confirmed via
# source that both text and icon glyphs are baked into the same font
# files at build time (FontAwesome5 merged with Montserrat by
# lv_font_conv), same bpp, no separate image mechanism, and the mono
# theme applies no special label styling.
#
# Tried 18/14 (up from the original 16/12): right half's icons were
# already fine before and after (never had the bug - not evidence the
# swap "fixed" anything there), but the left half got worse. Left is
# much more crowded (4 corner widgets vs the right's 1-2) and none of
# ZMK's built-in widgets set explicit sizes, so a bigger font clipping
# is plausible.
#
# 14/8 confirmed the fix: output/battery icons (default font) are
# clean, no more white-background glitch. But the layer widget uses
# ZMK's "small" font specifically (lv_theme_get_font_small(), set in
# ZMK's own status_screen.c, not something we can override without a
# custom screen) - at 8pt it's illegibly tiny. Bumping small to match
# default (14) instead of the original 12 or the too-tiny 8 - untested
# whether 8 was actually necessary for the fix or incidental.
# (ZMK_LV_FONT_DEFAULT_SMALL has no MONTSERRAT_10 choice - jumps 8->12 -
# so 8 was the only smaller option, one build error already burned
# finding that out.)
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_14=y
CONFIG_ZMK_LV_FONT_DEFAULT_SMALL_MONTSERRAT_14=y


# Custom status screen (config/src/status_screen.c) uses lv_label
# directly on both halves. Built-in widget Kconfig options normally pull
# this in via `select`, but those are central-only (see
# CONFIG_ZMK_WIDGET_WPM_STATUS above) - the peripheral half needs it
# enabled explicitly or label rendering fails to link there.
CONFIG_LV_USE_LABEL=y

# Enable Encoders
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# RGB Underglow. The devicetree side is now provided by mainline ZMK's
# own sofle shield (boards/nice_nano_nrf52840_zmk.overlay) instead of a
# hand-rolled overlay - see sofle.keymap. EXT_POWER=n keeps RGB_TOG from
# also cutting external power (which feeds the displays) - the shield's
# own sofle.conf template carries the same recommendation.
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n

# Auto-off RGB when idle to save nice!nano battery (25 min - 5x the
# previous 5 min, previous was too aggressive)
CONFIG_ZMK_IDLE_TIMEOUT=1500000
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
