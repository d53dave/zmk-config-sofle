# Uncomment the following line to enable the Sofle OLED Display
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_WIDGET_WPM_STATUS=y

# Enable Encoders
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# RGB Underglow temporarily disabled again: with underglow persisted
# "on", the right (peripheral, battery-powered) half now goes stone
# dead at boot before it can even receive a toggle command - looks like
# a boot-time brownout on that half's regulator, likely because it
# lacks the USB-hub current headroom the left/central half has. Needs a
# safe re-enable strategy (e.g. force a low default brightness / off on
# first boot) before flipping this back on. See NOTES.md.
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n

# Auto-off RGB when idle to save nice!nano battery
CONFIG_ZMK_IDLE_TIMEOUT=300000
# CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
