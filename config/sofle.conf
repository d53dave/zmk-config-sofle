# Uncomment the following line to enable the Sofle OLED Display
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_WIDGET_WPM_STATUS=y

# Enable Encoders
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# RGB Underglow temporarily disabled: the persisted "on" state was
# causing a power brownout at boot (both OLEDs blanking, keys
# dropping/double-firing) on every startup. Re-enable once brightness
# and/or decoupling is sorted out.
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=y

# Auto-off RGB when idle to save nice!nano battery
CONFIG_ZMK_IDLE_TIMEOUT=300000
# CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
