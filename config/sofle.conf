# Display. The nice_oled shield's own nice_oled.conf also sets
# ZMK_DISPLAY=y along with I2C/SSD1306, so this is belt-and-braces.
CONFIG_ZMK_DISPLAY=y

# Deliberately NOT set on this branch, unlike master:
#
#   CONFIG_ZMK_WIDGET_WPM_STATUS  - a widget of ZMK's *built-in* status
#       screen, which nice!oled replaces. nice!oled draws its own WPM
#       widget and does `select ZMK_WPM` itself, so the counter still
#       runs; this symbol would just be dead weight.
#   CONFIG_LV_USE_LABEL           - nice!oled selects it (together with
#       LV_USE_IMG/CANVAS/ANIMIMG/ANIMATION) from NICE_OLED_WIDGET_STATUS.
#       On master we set it by hand only because our own status_screen.c
#       needed labels on the peripheral half, and that file isn't built
#       here (see config/CMakeLists.txt).
#   CONFIG_LV_Z_MEM_POOL_SIZE     - master pins this to 8192 to fix
#       garbled glyphs under LVGL 9.3 (upstream zmk#3219). That bug is
#       specific to the Zephyr 4.1 stack and does not exist at v0.3.0 /
#       LVGL 8. More to the point, nice!oled budgets the pool per role in
#       its Kconfig.defconfig - 8192 central, 4096 peripheral - and it is
#       the memory-hungry component here, so it should own that number.
#       Pinning 8192 globally would hand the peripheral twice the RAM the
#       module intends. If glyphs misrender on this branch, raise it via
#       nice!oled's own knobs and see its docs/OPTIMIZE.md.

# Enable Encoders
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# RGB Underglow. Devicetree side comes from ZMK's own sofle shield -
# at v0.3.0 that's boards/nice_nano_v2.overlay (main's equivalent is
# boards/nice_nano_nrf52840_zmk.overlay; the rename came with HWMv2).
# Same spi3/led_strip/chosen zmk,underglow wiring either way, so no
# hand-rolled overlay is needed here - see sofle.keymap and NOTES.md.
# EXT_POWER=n keeps RGB_TOG from also cutting external power, which
# feeds the displays - the shield's own sofle.conf template carries the
# same recommendation.
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n

# Auto-off RGB when idle to save nice!nano battery (25 min - 5x the
# previous 5 min, previous was too aggressive)
CONFIG_ZMK_IDLE_TIMEOUT=1500000
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
