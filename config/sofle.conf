# Display. The nice_oled shield's own nice_oled.conf also sets
# ZMK_DISPLAY=y along with I2C/SSD1306, so this is belt-and-braces.
CONFIG_ZMK_DISPLAY=y

# Deliberately NOT set on this branch, unlike master:
#
#   CONFIG_ZMK_WIDGET_WPM_STATUS  - a widget of ZMK's *built-in* status
#       screen, which nice!oled replaces. nice!oled draws its own WPM
#       widget and does `select ZMK_WPM` itself, so the counter still
#       runs; this symbol would just be dead weight.
#   CONFIG_LV_USE_LABEL           - nice!oled selects it (together with
#       LV_USE_IMG/CANVAS/ANIMIMG/ANIMATION) from NICE_OLED_WIDGET_STATUS.
#       On master we set it by hand only because our own status_screen.c
#       needed labels on the peripheral half, and that file isn't built
#       here (see config/CMakeLists.txt).
#   CONFIG_LV_Z_MEM_POOL_SIZE     - master pins this to 8192 to fix
#       garbled glyphs under LVGL 9.3 (upstream zmk#3219). That bug is
#       specific to the Zephyr 4.1 stack and does not exist at v0.3.0 /
#       LVGL 8. More to the point, nice!oled budgets the pool per role in
#       its Kconfig.defconfig - 8192 central, 4096 peripheral - and it is
#       the memory-hungry component here, so it should own that number.
#       Pinning 8192 globally would hand the peripheral twice the RAM the
#       module intends. If glyphs misrender on this branch, raise it via
#       nice!oled's own knobs and see its docs/OPTIMIZE.md.

# --- nice!oled widget layout ---------------------------------------
# Right half: spaceman instead of the stock nyan cat. Nothing else to
# set - ANIMATION_PERIPHERAL_MS picks its default from whichever
# animation is on (4800 for spaceman, vs 960 for the cat), so the
# slower loop comes along for free.
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_CAT=n
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_SPACEMAN=y

# Left half: WPM as a graph rather than the default bongo cat.
# WPM_GRAPH_FIXED_RANGE is already y by default; the max is the part
# that matters. At the stock 100 the trace hugs the bottom of the plot
# unless you actually sustain 100wpm - 90 gives it more of the height.
CONFIG_NICE_OLED_WIDGET_WPM_BONGO_CAT=n
CONFIG_NICE_OLED_WIDGET_WPM_GRAPH=y
# 104 = 90 + 15%, after the 90 ceiling turned out to be too low - the
# trace was riding the top of the plot.
CONFIG_NICE_OLED_WIDGET_WPM_GRAPH_FIXED_RANGE_MAX=104

# Move the graph a quarter of the screen's long axis towards the top.
# With both the graph and the fixed modifier indicators on, they landed
# on top of each other: the grid image is 32 tall and was drawn at
# Y=95, i.e. Y 95..127 -> screen columns 32..64, while the 2x2 modifier
# box sits at MODIFIERS_CUSTOM_Y=100 and spans Y 100..129 -> columns
# 30..59. Upstream never had to solve this because it made the two
# mutually exclusive (see the guard note below).
#
# 95 - 32 = 63 puts the graph at Y 63..95 -> columns 64..96, clear of
# the modifiers with 5px to spare, and into the gap the battery readout
# used to fill before we pushed it off-canvas. 32 is 25% of the 128
# columns the glass shows. Nothing else lives there: the WPM *number*
# would, but WPM_NUMBER is default n and we leave it off.
#
# The knob itself is ours - see the fork in west.yml. It names the
# grid image's top-left corner; the trace baseline follows at +32.
CONFIG_NICE_OLED_WIDGET_WPM_GRAPH_CUSTOM_Y=63

# ...and the graph needs this off to draw at all. widgets/wpm.c gates it
# behind
#   #if WPM_LUNA || WPM_BONGO_CAT || MODIFIERS_INDICATORS_FIXED || !WPM_GRAPH
#   #else
#       draw_grid(); draw_graph();
#   #endif
# so any one of those suppresses the graph even with WPM_GRAPH=y.
# MODIFIERS_INDICATORS_FIXED defaults to y (inside MODIFIERS_INDICATORS,
# also default y), which is why the graph never appeared. They compete
# for the same strip of screen and the module resolves it by dropping
# the graph.
#
# We now run a patched fork (see west.yml) with that one term removed
# from the guard, so the graph and the fixed modifier indicators can
# both be on. Left explicit rather than relying on the default, because
# this line is the whole reason the fork exists.
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_FIXED=y

# Bongo cat comes back keypress-driven rather than WPM-averaged - but
# via the modifiers widget, NOT NICE_OLED_WIDGET_RESPONSIVE_BONGO_CAT.
#
# That one is an unfinished feature and cannot be enabled as shipped:
# widgets/responsive_bongo_cat.c references rotated assets
# (bongo_cat_right2_90, bongo_cat_both1_open_90, ...) that exist nowhere
# in the module, so the left half fails at link with undefined
# references. Its own CMakeLists has the matching assets line commented
# out (and assets/responsive_bongo_cat_images.c defines a different,
# older symbol set - fast_img1/idle_img1/...), and its Kconfig block is
# an empty `# TODO:`. No config or vendoring fixes it; the artwork would
# have to be generated.
#
# MODIFIERS_INDICATORS is already default y, and its bongo cat draws
# from assets/bongo_cat_images.c, which the module compiles
# unconditionally - so this one actually links. It animates on modifier
# presses, which is the responsive feel we were after anyway.
# Off, for two reasons. modifiers.c treats FIXED and BONGO_CAT as an
# if/elif pair, so with FIXED on the bongo cat branch is dead code
# anyway. And it draws at X=64, past the 32px axis these screens
# actually show - so it never rendered here even when it was the only
# modifier variant enabled.
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_BONGO_CAT=n

# nice!oled intends a 2560 display thread stack (its Kconfig.defconfig
# baseline) but never gets it: ZMK v0.3.0 declares the symbol in
# app/src/display/Kconfig with `default 2048`, and that wins over a
# module defconfig. Verified in the generated config. Restore the
# module's intended baseline by hand - an assignment here beats every
# default - since we're now driving a 10s pokemon loop plus the WPM
# graph off that thread.
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=2560

# The layer widget needed no config at all - the fix is display-name on
# each layer in sofle.keymap. It was rendering an empty string, which
# looks identical to being disabled. See the comment there.
#
# An earlier LAYER_CUSTOM_Y override here was a wrong guess and has been
# removed; the stock 146 is fine. For reference, the coordinate model:
# widgets draw into a CANVAS_HEIGHT x CANVAS_HEIGHT (160x160) buffer,
# then rotate_canvas() in widgets/util.c spins it 90 degrees before it
# reaches the 128x32 glass. Working that through, a widget is visible
# when its X < 32 and its Y is in (31, 159], and its Y maps to a screen
# column of roughly 159-Y. So the stock layout runs high-Y on the left
# of the screen to low-Y on the right:
#
#   layer   Y=146 -> col 13    profile Y=137 -> col 22
#   modifs  Y=100 -> col 59    wpm     Y=70  -> col 89
#   battery Y=50  -> col 109   output  Y=34  -> col 125
#
# which is also why battery at Y=200 disappears: past the 160 buffer
# entirely. Widgets with X >= 32 (hid indicators at 36, bongo cat and
# luna at 64/65) fall outside the 32px axis and never show on these
# screens.

# No batteries on this build. The module has no switch to disable the
# readout - draw_battery_status() is called unconditionally in
# widgets/battery.c, and the three SHOW_BATTERY_PERIPHERAL_* options
# only choose *which* batteries appear. Only the position is
# configurable, so push it past the bottom of the 160px canvas (default
# Y is 50) and let LVGL clip it.
#
# This is a hack and it is the one thing here most likely to misbehave.
# If it does, the clean fix is vendoring the module and #if-ing the call
# out properly - cheap on this branch, since we're pinned to a frozen
# ZMK anyway.
CONFIG_NICE_OLED_WIDGET_BATTERY_CUSTOM_Y=200

# Enable Encoders
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# RGB Underglow. Devicetree side comes from ZMK's own sofle shield -
# at v0.3.0 that's boards/nice_nano_v2.overlay (main's equivalent is
# boards/nice_nano_nrf52840_zmk.overlay; the rename came with HWMv2).
# Same spi3/led_strip/chosen zmk,underglow wiring either way, so no
# hand-rolled overlay is needed here - see sofle.keymap and NOTES.md.
# EXT_POWER=n keeps RGB_TOG from also cutting external power, which
# feeds the displays - the shield's own sofle.conf template carries the
# same recommendation.
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n

# Auto-off RGB when idle to save nice!nano battery (25 min - 5x the
# previous 5 min, previous was too aggressive)
CONFIG_ZMK_IDLE_TIMEOUT=1500000
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
