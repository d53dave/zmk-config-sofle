# Uncomment the following line to enable the Sofle OLED Display
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_WIDGET_WPM_STATUS=y

# Enable Encoders
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# RGB Underglow. Re-enabled after fixing the hardware causes of the
# earlier brownout: a lifted LED solder pad (bridged), and running the
# front indicator LED un-bypassed (dimmed with a Posca marker dot)
# instead of using the bypass jumper.
CONFIG_ZMK_RGB_UNDERGLOW=y

# By default, toggling underglow off also toggles ext_power off, which
# also cuts the displays (and briefly glitches the matrix) -> the
# blank-screen/dropped-key symptom. Keep RGB_TOG decoupled from
# ext_power.
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n

# Auto-off RGB when idle to save nice!nano battery
CONFIG_ZMK_IDLE_TIMEOUT=300000
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
