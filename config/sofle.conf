# Uncomment the following line to enable the Sofle OLED Display
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_WIDGET_WPM_STATUS=y

# Icon glyphs (LV_SYMBOL_* - battery/output/layer) rendered as
# noise/inverted while plain text stayed fine. Root cause was the LVGL
# memory pool, not the fonts. CONFIRMED FIXED on hardware 2026-08-10
# with the setting below, at ZMK's stock 16/12 fonts - so the font
# tradeoff those earlier commits accepted was never necessary.
#
# west.yml tracks zmk `main`, so this build has been on Zephyr 4.1 /
# LVGL 9.3 since that landed upstream 2025-12-09. Upstream ZMK issue
# #3219 reports the identical symptom after that update (glyphs as
# pixelated blocks) with an undersized LVGL pool as the cause, fixed by
# raising LV_Z_MEM_POOL_SIZE from 4096 to 4608+.
#
# We were on exactly the value #3219 calls too small. Confirmed from the
# generated config of the previous CI run (31399075045), pre-change:
#   CONFIG_LV_Z_MEM_POOL_SIZE=4096
#   CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y
# That 4096 comes from zmk app/src/display/Kconfig,
# `default 4096 if ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN` - which applies
# because the custom screen is currently commented out in config/Kconfig
# (it crashed hardware, see NOTES.md). So this is not a variant of
# #3219, it is precisely the case it describes, and 4608 is the reported
# minimum for correct glyphs.
#
# 8192 rather than a bare 4608 for headroom, and because it isn't a
# guess: it's what ZMK itself defaults to for a custom status screen on
# nice_view (app/boards/shields/nice_view/Kconfig.defconfig).
#
# Note for later: if the custom status screen is ever re-enabled, the
# 4096 default stops applying (it's gated on _BUILT_IN) and nothing else
# here would raise it - the fallback is Zephyr's own `default 2048` in
# modules/lvgl/Kconfig.memory. This explicit setting covers both cases.
#
# This also explains the earlier font experiments (07d74d1..96ec502)
# better than the clipping theory they assumed: 18/14 made it worse
# (bigger glyph cache), 14/8 "fixed" it (smaller), the left half with 4
# widgets was worse than the right with 1-2, and the artifact was noise
# rather than clean truncation. Font size was only ever a proxy for
# memory use, so the explicit font pins are reverted here - back to
# ZMK's 16/12 defaults, which are legible.
#
# The #3219 reporter claimed .conf assignment appeared ineffective. The
# symbol does carry a prompt ("Memory pool size") so it is settable, but
# it `depends on LV_Z_MEM_POOL_SYS_HEAP` - one arm of a choice that also
# offers LV_Z_MEM_POOL_HEAP_LIB_C. SYS_HEAP is the choice default and
# nothing here overrides it, but if the assignment ever looks ignored,
# that dependency going inactive is the first thing to check. Verify
# against the *generated* config, not this file:
#   grep LV_Z_MEM_POOL build/zephyr/.config
CONFIG_LV_Z_MEM_POOL_SIZE=8192


# Custom status screen (config/src/status_screen.c) uses lv_label
# directly on both halves. Built-in widget Kconfig options normally pull
# this in via `select`, but those are central-only (see
# CONFIG_ZMK_WIDGET_WPM_STATUS above) - the peripheral half needs it
# enabled explicitly or label rendering fails to link there.
CONFIG_LV_USE_LABEL=y

# Enable Encoders
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# RGB Underglow. The devicetree side is now provided by mainline ZMK's
# own sofle shield (boards/nice_nano_nrf52840_zmk.overlay) instead of a
# hand-rolled overlay - see sofle.keymap. EXT_POWER=n keeps RGB_TOG from
# also cutting external power (which feeds the displays) - the shield's
# own sofle.conf template carries the same recommendation.
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n

# Auto-off RGB when idle to save nice!nano battery (25 min - 5x the
# previous 5 min, previous was too aggressive)
CONFIG_ZMK_IDLE_TIMEOUT=1500000
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
