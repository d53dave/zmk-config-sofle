# Overrides for the zmk-nice-oled module (nice_oled shield). Deliberately
# minimal for the first hardware test: static image on the peripheral
# instead of the default cat animation, no RAW HID, no extra central
# widgets. This module overrides zmk_display_status_screen() via the same
# CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM mechanism that crashed on this
# board twice before (see NOTES.md) - keeping it minimal first tells us
# whether that was specific to the old hand-rolled widget code or something
# more fundamental, before turning on anything fancier.

# Peripheral: fixed image instead of the animated cat.
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL=n
CONFIG_NICE_OLED_WIDGET_STATIC_IMAGE_PERIPHERAL=y
CONFIG_NICE_OLED_WIDGET_STATIC_IMAGE_PERIPHERAL_VIM=y

# Central: keep it to just the layer widget for now.
CONFIG_NICE_OLED_WIDGET_WPM=n
CONFIG_NICE_OLED_WIDGET_HID_INDICATORS=n
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS=n
